<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>MI Logistics Dashboard</title>
    <script src="https://cdn.sheetjs.com/xlsx-0.20.1/package/dist/xlsx.full.min.js"></script>
    <style>
        /* Modern Color Palette */
        :root {
            --mi-red: #D6192B;
            --deep-space: #24223F;
            --white: #FFFEFF;
            --off-white: #F5F7FA;
            --text-gray: #718096;
        }

        body { 
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif; 
            background: var(--off-white); 
            margin: 0; 
            display: flex; 
            height: 100vh; 
            color: var(--deep-space);
        }

        /* Sidebar Design */
        .sidebar { 
            width: 280px; 
            background: var(--deep-space); 
            color: var(--white); 
            display: flex; 
            flex-direction: column;
            box-shadow: 4px 0 10px rgba(0,0,0,0.1);
        }

        .sidebar-header { 
            padding: 30px 24px; 
            background: rgba(0,0,0,0.2);
            text-align: center;
        }

        .sidebar-header h2 { 
            font-size: 1.1rem; 
            margin: 0; 
            letter-spacing: 2px; 
            font-weight: 800;
            color: var(--mi-red);
        }

        .nav-list { flex: 1; padding: 20px 0; overflow-y: auto; }
        
        .nav-item { 
            width: 100%; 
            padding: 14px 24px; 
            border: none; 
            background: none; 
            color: #A0AEC0; 
            text-align: left; 
            cursor: pointer; 
            font-size: 0.9rem;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .nav-item:hover { background: rgba(255,255,255,0.05); color: var(--white); }
        
        .nav-item.active { 
            background: var(--mi-red); 
            color: var(--white); 
            font-weight: 600;
            box-shadow: 0 4px 12px rgba(214, 25, 43, 0.3);
        }

        /* Content Area */
        .content { flex: 1; overflow-y: auto; display: flex; flex-direction: column; }
        
        .top-bar { 
            background: var(--white); 
            padding: 18px 40px; 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            border-bottom: 1px solid #E2E8F0;
        }

        .view-area { padding: 40px; }

        .card { 
            background: var(--white); 
            border-radius: 16px; 
            padding: 30px; 
            box-shadow: 0 10px 30px rgba(36, 34, 63, 0.05);
        }

        /* Modern Table Styling */
        .table-container { overflow-x: auto; border-radius: 8px; border: 1px solid #EDF2F7; }
        table { width: 100%; border-collapse: collapse; }
        
        th { 
            background: #F8FAFC; 
            color: var(--deep-space); 
            font-size: 0.75rem; 
            text-transform: uppercase; 
            letter-spacing: 1px;
            padding: 16px;
            border-bottom: 2px solid #EDF2F7;
            text-align: left;
        }

        td { 
            padding: 14px 16px; 
            border-bottom: 1px solid #F1F5F9; 
            font-size: 0.85rem; 
            color: #475569;
        }

        tr:hover { background-color: #FDFDFD; }

        /* Initial Upload UI */
        #upload-overlay {
            position: fixed; inset: 0; background: var(--off-white); z-index: 1000;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
        }

        .drop-box { 
            background: var(--white);
            border: 2px dashed #CBD5E0; 
            padding: 60px; 
            border-radius: 24px; 
            text-align: center; 
            width: 450px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.05);
        }

        .btn-upload { 
            background: var(--mi-red); 
            color: var(--white); 
            border: none; 
            padding: 14px 32px; 
            border-radius: 10px; 
            font-weight: 700; 
            cursor: pointer; 
            margin-top: 24px;
            transition: transform 0.2s;
        }

        .btn-upload:hover { transform: translateY(-2px); filter: brightness(1.1); }
    </style>
</head>
<body>

    <div id="upload-overlay">
        <div class="drop-box" id="drop-zone">
            <div style="font-size: 40px; margin-bottom: 10px;">📊</div>
            <h1 style="color: var(--deep-space); margin: 0 0 10px 0;">MI Logistics</h1>
            <p style="color: var(--text-gray);">Optimization Tool v2.0</p>
            <input type="file" id="file-input" hidden accept=".xlsx, .xls">
            <button class="btn-upload" onclick="document.getElementById('file-input').click()">LOAD LOGISTICS DATA</button>
        </div>
    </div>

    <aside class="sidebar">
        <div class="sidebar-header">
            <h2>MI LOGISTICS</h2>
        </div>
        <div class="nav-list" id="sidebar-nav">
            </div>
    </aside>

    <main class="content">
        <div class="top-bar">
            <h3 id="current-sheet-title" style="margin:0; font-weight: 700;">Data Overview</h3>
            <div id="file-name-display" style="background: var(--off-white); padding: 6px 14px; border-radius: 20px; font-size: 0.75rem; color: var(--text-gray);"></div>
        </div>

        <div class="view-area">
            <div class="card" id="data-card">
                <div id="table-output">
                    </div>
            </div>
        </div>
    </main>

    <script src="app.js"></script>
</body>
</html>
