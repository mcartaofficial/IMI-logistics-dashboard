<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IMI Logistics Dashboard</title>
    <script src="https://cdn.sheetjs.com/xlsx-0.20.1/package/dist/xlsx.full.min.js"></script>
    <style>
        :root {
            --mi-red: #D6192B;
            --deep-space: #24223F;
            --white: #FFFEFF;
            --off-white: #F5F7FA;
            --text-gray: #718096;
            --sidebar-width: 280px;
        }

        body { 
            font-family: 'Inter', system-ui, sans-serif; 
            background: var(--off-white); 
            margin: 0; 
            display: flex; 
            height: 100vh; 
            overflow: hidden;
        }

        /* Sidebar */
        .sidebar { 
            width: var(--sidebar-width); 
            background: var(--deep-space); 
            display: flex; 
            flex-direction: column;
            z-index: 1001;
            transition: transform 0.3s ease;
        }

        .sidebar.collapsed { transform: translateX(-100%); position: absolute; height: 100%; }

        .sidebar-header { padding: 30px 24px; border-bottom: 1px solid rgba(255,255,255,0.1); }
        .sidebar-header h2 { font-size: 1rem; color: white; margin: 0; text-transform: uppercase; letter-spacing: 1px; }

        .nav-list { flex: 1; padding: 20px 0; overflow-y: auto; }
        .nav-item { 
            width: 100%; padding: 14px 24px; border: none; background: none; 
            color: #8E9AAF; text-align: left; cursor: pointer; transition: 0.2s;
            font-weight: 500;
        }
        .nav-item:hover { color: white; background: rgba(255,255,255,0.05); }
        .nav-item.active { background: var(--mi-red); color: white; }

        /* Content Area */
        .content { flex: 1; display: flex; flex-direction: column; overflow-y: auto; }
        
        .top-bar { 
            background: white; padding: 15px 30px; display: flex; 
            align-items: center; justify-content: space-between;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05); position: sticky; top: 0; z-index: 10;
        }

        .menu-toggle {
            background: var(--deep-space); color: white; border: none;
            width: 35px; height: 35px; border-radius: 4px; cursor: pointer;
        }

        .view-area { padding: 30px; }
        .card { background: white; border-radius: 12px; padding: 25px; box-shadow: 0 4px 20px rgba(0,0,0,0.05); }

        /* Re-engineered Table & Inputs */
        .table-container { overflow-x: auto; margin-top: 10px; }
        table { width: 100%; border-collapse: collapse; }
        th { background: #f8fafc; text-align: left; padding: 12px; font-size: 0.75rem; color: var(--text-gray); text-transform: uppercase; }
        td { padding: 8px 12px; border-bottom: 1px solid #f1f5f9; }

        .cell-edit {
            width: 100%; border: 1px solid transparent; background: #fdfdfd;
            padding: 6px 10px; border-radius: 4px; font-family: inherit; font-size: 0.85rem;
            transition: 0.2s;
        }
        .cell-edit:hover { border-color: #cbd5e1; background: white; }
        .cell-edit:focus { outline: none; border-color: var(--mi-red); box-shadow: 0 0 0 2px rgba(214, 25, 43, 0.1); background: white; }

        /* Home Page Stats */
        .welcome-container { text-align: center; padding: 20px 0; }
        .welcome-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; margin: 20px 0; }
        .stat-box { background: #f8fafc; padding: 15px; border-radius: 8px; border-top: 3px solid var(--mi-red); }

        /* Widgets */
        .widget-section { margin-top: 30px; }
        .widget-label { font-weight: 700; margin-bottom: 10px; color: var(--deep-space); font-size: 0.8rem; }
        .hard-clip-wrapper { border-radius: 8px; border: 1px solid #eee; overflow: hidden; background: white; }
        iframe { width: 100%; height: 100%; border: none; }

        /* Overlay */
        #upload-overlay { position: fixed; inset: 0; background: var(--off-white); z-index: 2000; display: flex; justify-content: center; align-items: center; }
        .drop-box { background: white; padding: 50px; border-radius: 20px; text-align: center; box-shadow: 0 20px 40px rgba(0,0,0,0.1); }
        .btn-upload { background: var(--mi-red); color: white; border: none; padding: 12px 30px; border-radius: 6px; font-weight: 700; cursor: pointer; margin-top: 20px; }
    </style>
</head>
<body>

    <div id="upload-overlay">
        <div class="drop-box">
            <div style="font-size: 40px;">🚢</div>
            <h2>IMI Logistics Engine</h2>
            <p style="color: var(--text-gray);">Load your Excel dataset to begin.</p>
            <input type="file" id="file-input" hidden accept=".xlsx, .xls">
            <button class="btn-upload" onclick="document.getElementById('file-input').click()">CHOOSE FILE</button>
        </div>
    </div>

    <aside class="sidebar" id="sidebar">
        <div class="sidebar-header"><h2>IMI Logistics</h2></div>
        <div class="nav-list" id="sidebar-nav"></div>
    </aside>

    <main class="content">
        <div class="top-bar">
            <div style="display: flex; align-items: center; gap: 15px;">
                <button class="menu-toggle" id="menu-toggle">☰</button>
                <h3 id="current-sheet-title" style="margin:0;">Dashboard</h3>
            </div>
            <div id="file-name-display" style="font-size: 0.7rem; font-weight: 700; color: var(--text-gray);"></div>
        </div>

        <div class="view-area">
            <div class="card">
                <div id="table-output"></div>
                <div id="map-container"></div>
            </div>
        </div>
    </main>

    <script src="https://elfsightcdn.com/platform.js" async></script>
    <script src="app.js"></script>
</body>
</html>
