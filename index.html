<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>IMI Optimization Dashboard</title>
    <script src="https://cdn.sheetjs.com/xlsx-0.20.1/package/dist/xlsx.full.min.js"></script>
    <style>
        :root { --imi-red: #E31E24; --navy: #1A1D2E; --light-gray: #f4f7f6; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--light-gray); margin: 0; display: flex; flex-direction: column; height: 100vh; }
        
        /* Sidebar/TopNav Branding */
        .header { background: var(--navy); color: white; padding: 1rem 2rem; display: flex; justify-content: space-between; align-items: center; }
        
        /* Navigation Buttons */
        .nav-bar { background: white; border-bottom: 2px solid #ddd; padding: 0 2rem; display: flex; gap: 10px; overflow-x: auto; }
        .nav-btn { 
            padding: 15px 25px; border: none; background: none; cursor: pointer; 
            font-weight: 600; color: #666; border-bottom: 3px solid transparent; transition: 0.2s;
        }
        .nav-btn.active { color: var(--imi-red); border-bottom-color: var(--imi-red); background: #fff5f5; }

        /* Main Content Area */
        .main-content { flex: 1; padding: 2rem; overflow-y: auto; }
        .card { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }

        /* Upload Overlay */
        #upload-screen { 
            position: fixed; inset: 0; background: white; z-index: 100; 
            display: flex; flex-direction: column; align-items: center; justify-content: center; 
        }
        .drop-zone { border: 3px dashed #cbd5e0; padding: 60px; border-radius: 20px; text-align: center; width: 50%; }

        /* Table Styling */
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th { background: #f8f9fa; text-align: left; padding: 12px; border: 1px solid #dee2e6; color: var(--navy); }
        td { padding: 10px; border: 1px solid #dee2e6; font-size: 14px; }
        tr:nth-child(even) { background-color: #fafafa; }
    </style>
</head>
<body>

    <div id="upload-screen">
        <div class="drop-zone" id="drop-zone">
            <h1 style="color: var(--navy)">IMI Route Optimizer</h1>
            <p>Please upload <strong>LP_Enhanced_IMI_WhatIf_1.xlsx</strong></p>
            <input type="file" id="file-input" hidden accept=".xlsx, .xls">
            <button class="nav-btn" style="background: var(--imi-red); color: white; border-radius: 5px; margin-top: 10px;" onclick="document.getElementById('file-input').click()">Browse Files</button>
        </div>
        <p id="status-msg" style="margin-top: 20px; color: #666;"></p>
    </div>

    <div class="header">
        <h2 style="margin:0">IMI Dashboard</h2>
        <div id="file-info" style="font-size: 0.9rem; opacity: 0.8;"></div>
    </div>

    <nav class="nav-bar" id="nav-bar">
        </nav>

    <main class="main-content">
        <div id="page-title" style="margin-bottom: 20px; font-size: 1.5rem; font-weight: bold; color: var(--navy);"></div>
        <div id="sheet-content" class="card">
            <p style="color: #999;">Select a tab above to view optimization data.</p>
        </div>
    </main>

    <script src="app.js"></script>
</body>
</html>
