<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>IMI Logistics Dashboard</title>
    <script src="https://cdn.sheetjs.com/xlsx-0.20.1/package/dist/xlsx.full.min.js"></script>
    <style>
        :root {
            --mi-red: #D6192B;
            --deep-space: #24223F;
            --white: #FFFEFF;
            --off-white: #F5F7FA;
            --text-gray: #718096;
            --sidebar-width: 300px;
        }

        body { 
            font-family: 'Inter', -apple-system, sans-serif; 
            background: var(--off-white); 
            margin: 0; 
            display: flex; 
            height: 100vh; 
            overflow: hidden;
        }

        .sidebar { 
            width: var(--sidebar-width); 
            background: var(--deep-space); 
            color: var(--white); 
            display: flex; 
            flex-direction: column;
            box-shadow: 4px 0 15px rgba(0,0,0,0.2);
            z-index: 1001;
        }

        .sidebar-header { padding: 40px 24px; }
        .nav-list { flex: 1; padding: 25px 0; overflow-y: auto; }

        .nav-item { 
            width: 100%; 
            padding: 16px 28px; 
            border: none; 
            background: none; 
            color: #8E9AAF; 
            text-align: left; 
            cursor: pointer;
        }

        .nav-item.active { background: var(--mi-red); color: white; }

        .content { flex: 1; overflow-y: auto; display: flex; flex-direction: column; }

        .top-bar { 
            background: var(--white); 
            padding: 15px 30px; 
            display: flex; 
            justify-content: space-between; 
            align-items: center;
        }

        .view-area { padding: 45px; }

        .card { 
            background: var(--white); 
            border-radius: 20px; 
            padding: 35px; 
            margin-bottom: 20px;
        }

        .table-container { overflow-x: auto; border-radius: 12px; }
        table { width: 100%; border-collapse: collapse; min-width: 800px; }

        th { padding: 18px; }
        td { padding: 16px; }

        /* ✅ ADDED INTERACTIVE STYLES */
        td[contenteditable="true"], th[contenteditable="true"] {
            background: #fff;
            cursor: text;
        }

        td[contenteditable="true"]:hover {
            background: #f9fafb;
        }

        .active-cell {
            outline: 2px solid #D6192B;
            background: #fff5f5 !important;
        }

        #upload-overlay {
            position: fixed; inset: 0; background: var(--off-white); z-index: 2000;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
        }
    </style>
</head>
<body>

<div id="upload-overlay">
    <div class="drop-box">
        <h1>IMI Logistics</h1>
        <input type="file" id="file-input" hidden accept=".xlsx, .xls">
        <button onclick="document.getElementById('file-input').click()">UPLOAD</button>
    </div>
</div>

<aside class="sidebar" id="sidebar">
    <div class="sidebar-header">
        <h2>IMI Logistics Dashboard</h2>
    </div>
    <div class="nav-list" id="sidebar-nav"></div>
</aside>

<main class="content">
    <div class="top-bar">
        <h3 id="current-sheet-title">Welcome</h3>
        <div id="file-name-display"></div>
    </div>

    <div class="view-area">
        <div class="card" id="data-card">
            <div id="table-output"></div>
            <div id="map-container"></div>
        </div>
    </div>
</main>

<script src="https://elfsightcdn.com/platform.js" async></script>
<script src="app.js"></script>
</body>
</html>
