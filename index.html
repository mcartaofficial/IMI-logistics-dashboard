<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IMI Shipping & Freight - Route Optimization Dashboard</title>
    <script src="https://cdn.sheetjs.com/xlsx-0.20.1/package/dist/xlsx.full.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            /* IMI Brand Colors */
            --imi-red: #E31E24;
            --imi-dark-red: #C41E3A;
            --imi-navy: #1A1D2E;
            --imi-white: #FFFFFF;
            
            /* Modern UI Colors */
            --bg-primary: #F8F9FA;
            --bg-secondary: #FFFFFF;
            --bg-card: #FFFFFF;
            --text-primary: #1A1D2E;
            --text-secondary: #6C757D;
            --border-color: #DEE2E6;
            --accent-green: #28A745;
            
            /* Shadows */
            --shadow-md: 0 4px 12px rgba(0, 0, 0, 0.08);
            --shadow-xl: 0 12px 40px rgba(0, 0, 0, 0.15);
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            line-height: 1.6;
        }

        /* Header with IMI Background */
        .header {
            background: linear-gradient(135deg, rgba(26, 29, 46, 0.97) 0%, rgba(26, 29, 46, 0.95) 100%),
                        url('Cargo_Ship.jpg') center center/cover;
            color: var(--imi-white);
            padding: 3rem 0;
            box-shadow: var(--shadow-xl);
            position: relative;
        }

        .header-content {
            max-width: 1400px;
            margin: 0 auto;
            padding: 0 2rem;
            display: flex;
            align-items: center;
            gap: 2rem;
        }

        .logo {
            width: 180px;
            background: var(--imi-white);
            border-radius: 12px;
            padding: 1rem;
            box-shadow: var(--shadow-md);
        }

        h1 { font-size: 2.5rem; font-weight: 700; }
        .subtitle { font-size: 1.1rem; opacity: 0.9; font-weight: 300; }

        .container {
            max-width: 1400px;
            margin: 2.5rem auto;
            padding: 0 2rem;
        }

        .card {
            background: var(--bg-card);
            border-radius: 16px;
            padding: 2.5rem;
            margin-bottom: 2rem;
            box-shadow: var(--shadow-md);
            border: 1px solid var(--border-color);
        }

        .card-title {
            font-size: 1.5rem;
            margin-bottom: 1.5rem;
            display: flex;
            align-items: center;
            gap: 0.75rem;
            border-bottom: 3px solid var(--imi-red);
            padding-bottom: 0.5rem;
        }

        /* New Drag & Drop Zone Styling */
        #drop-zone {
            border: 3px dashed var(--border-color);
            border-radius: 16px;
            padding: 4rem 2rem;
            text-align: center;
            background: var(--bg-primary);
            transition: all 0.3s ease;
            cursor: pointer;
            position: relative;
        }

        #drop-zone.dragover {
            border-color: var(--imi-red);
            background: rgba(227, 30, 36, 0.05);
            transform: scale(1.01);
        }

        #drop-zone .icon {
            font-size: 3.5rem;
            margin-bottom: 1rem;
            display: block;
        }

        #drop-zone .upload-text {
            font-size: 1.25rem;
            font-weight: 600;
            color: var(--imi-navy);
        }

        #drop-zone .sub-text {
            color: var(--text-secondary);
            margin-top: 0.5rem;
        }

        #file-status {
            margin-top: 1.5rem;
            font-weight: 600;
            padding: 1rem;
            border-radius: 8px;
            display: none;
        }

        /* Button & Results Styling */
        .btn {
            background: linear-gradient(135deg, var(--imi-red) 0%, var(--imi-dark-red) 100%);
            color: white;
            padding: 1rem 2rem;
            border: none;
            border-radius: 12px;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
            margin-top: 1rem;
        }

        .btn:disabled { opacity: 0.5; cursor: not-allowed; }

        .dashboard-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 2rem;
            margin-top: 2rem;
        }

        .sheet-section {
            background: white;
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid var(--border-color);
        }

        .sheet-header {
            background: var(--imi-navy);
            color: white;
            padding: 1rem 1.5rem;
            font-weight: 600;
        }

        .table-wrapper {
            overflow-x: auto;
            padding: 1rem;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.9rem;
        }

        th { background: #f8f9fa; text-align: left; padding: 12px; border-bottom: 2px solid #dee2e6; }
        td { padding: 10px; border-bottom: 1px solid #eee; }
    </style>
</head>
<body>

    <div class="header">
        <div class="header-content">
            <div class="logo">
                <img src="imi_logo.png" alt="IMI Logo" style="width:100%">
            </div>
            <div>
                <h1>Route Optimization Dashboard</h1>
                <p class="subtitle">AI-Powered Shipping Intelligence | Freight Analysis</p>
            </div>
        </div>
    </div>

    <div class="container">
        <div class="card">
            <h2 class="card-title"><span>📦</span> Data Integration</h2>
            <div id="drop-zone">
                <span class="icon">📊</span>
                <p class="upload-text">Drag & Drop "LP_Enhanced_IMI_WhatIf_1.xlsx" here</p>
                <p class="sub-text">or click to browse files</p>
                <input type="file" id="file-input" hidden accept=".xlsx">
            </div>
            <div id="file-status"></div>
            
            <button class="btn" id="optimize-btn" disabled>
                🚀 Generate Dashboard Results
            </button>
        </div>

        <div id="dashboard-output" class="dashboard-grid">
            </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
