<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>IMI Optimization - ULTRA STABLE</title>
    <script src="https://cdn.sheetjs.com/xlsx-0.20.1/package/dist/xlsx.full.min.js"></script>
    <style>
        :root { --imi-red: #E31E24; --navy: #1A1D2E; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #f0f2f5; margin: 0; }
        .container { max-width: 1000px; margin: 40px auto; padding: 20px; }
        
        /* The Heavy-Duty Dropzone */
        #drop-zone {
            background: white; border: 4px dashed #bdc3c7; border-radius: 20px;
            padding: 60px; text-align: center; transition: all 0.3s;
            box-shadow: 0 10px 25px rgba(0,0,0,0.05);
        }
        #drop-zone.active { border-color: var(--imi-red); background: #fff9f9; transform: scale(1.02); }
        
        .btn-main {
            background: var(--imi-red); color: white; border: none; padding: 15px 30px;
            font-size: 18px; border-radius: 8px; cursor: pointer; width: 100%;
            margin-top: 20px; font-weight: bold; box-shadow: 0 4px 15px rgba(227, 30, 36, 0.3);
        }
        .btn-main:disabled { background: #bdc3c7; cursor: not-allowed; box-shadow: none; }

        /* System Logger Styling */
        #system-log {
            background: #2c3e50; color: #2ecc71; font-family: monospace;
            padding: 15px; border-radius: 8px; margin-top: 20px;
            max-height: 200px; overflow-y: auto; font-size: 12px; line-height: 1.5;
        }
        .log-error { color: #e74c3c; }
        
        #data-display { margin-top: 30px; }
        table { width: 100%; border-collapse: collapse; background: white; margin-bottom: 20px; }
        th, td { border: 1px solid #ddd; padding: 12px; text-align: left; }
        th { background: var(--navy); color: white; }
    </style>
</head>
<body>

<div class="container">
    <div id="drop-zone">
        <h2 id="prompt-text">Step 1: Upload LP_Enhanced_IMI_WhatIf_1.xlsx</h2>
        <p>Drag file here or click the button below</p>
        <button class="btn-main" onclick="document.getElementById('file-input').click()">BROWSE COMPUTER</button>
        <input type="file" id="file-input" hidden accept=".xlsx, .xls, .xlsm">
    </div>

    <div id="system-log">
        > System ready. Waiting for file...
    </div>

    <button id="optimize-btn" class="btn-main" style="background: var(--navy);" disabled>
        Step 2: Run Optimization Analysis
    </button>

    <div id="data-display"></div>
</div>

<script src="app.js"></script>
</body>
</html>
