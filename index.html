<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IMI Shipping - Route Optimization</title>
    <script src="https://cdn.sheetjs.com/xlsx-0.20.1/package/dist/xlsx.full.min.js"></script>
    <style>
        :root {
            --imi-red: #E31E24; --imi-navy: #1A1D2E; --bg: #F8F9FA;
        }
        body { font-family: sans-serif; background: var(--bg); margin: 0; padding: 0; }
        .header { background: var(--imi-navy); color: white; padding: 2rem; text-align: center; }
        .container { max-width: 1200px; margin: 2rem auto; padding: 0 1rem; }
        
        /* Dropzone Styling */
        #drop-zone {
            border: 3px dashed #ccc; border-radius: 12px; padding: 50px;
            text-align: center; background: white; cursor: pointer; transition: 0.3s;
        }
        #drop-zone.dragover { border-color: var(--imi-red); background: #fff5f5; }
        #drop-zone:hover { border-color: #999; }
        
        .btn {
            background: var(--imi-red); color: white; border: none; padding: 12px 24px;
            border-radius: 6px; font-weight: bold; cursor: pointer; width: 100%; margin-top: 1rem;
        }
        .btn:disabled { background: #ccc; cursor: not-allowed; }
        
        #status-msg { margin: 1rem 0; font-weight: bold; text-align: center; display: none; }
        .sheet-card { background: white; margin-top: 2rem; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); overflow: hidden; }
        .sheet-title { background: #333; color: white; padding: 10px 20px; font-weight: bold; }
        .table-wrap { overflow-x: auto; padding: 1rem; }
        table { width: 100%; border-collapse: collapse; font-size: 0.85rem; }
        th { background: #eee; text-align: left; padding: 8px; border: 1px solid #ddd; }
        td { padding: 8px; border: 1px solid #ddd; }
    </style>
</head>
<body>

    <div class="header">
        <h1>IMI Route Optimization Dashboard</h1>
        <p>Upload LP_Enhanced_IMI_WhatIf_1.xlsx to begin</p>
    </div>

    <div class="container">
        <div id="drop-zone">
            <div style="font-size: 3rem;">📄</div>
            <p><strong>Click to select</strong> or Drag & Drop the Excel file here</p>
            <input type="file" id="file-input" hidden accept=".xlsx, .xls">
        </div>

        <div id="status-msg"></div>

        <button id="process-btn" class="btn" disabled>Generate Analysis</button>

        <div id="output"></div>
    </div>

    <script src="app.js"></script>
</body>
</html>
