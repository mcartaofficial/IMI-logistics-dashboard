<style>
    /* ... existing variables ... */

    /* New Sidebar Styling */
    .sidebar { 
        width: 260px; 
        background: var(--deep-space); 
        color: var(--white); 
        display: flex; 
        flex-direction: column;
        box-shadow: 4px 0 15px rgba(0,0,0,0.2);
        z-index: 1001;
        position: absolute; /* Floating effect */
        height: auto;
        max-height: 90vh;
        left: 20px;
        top: 80px;
        border-radius: 12px;
        transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        overflow: hidden;
        opacity: 0;
        visibility: hidden;
        transform: translateY(-10px);
    }

    /* When the menu is "Open" */
    .sidebar.active {
        opacity: 1;
        visibility: visible;
        transform: translateY(0);
    }

    /* The Hamburger Button */
    .menu-toggle {
        position: fixed;
        top: 20px;
        left: 20px;
        width: 45px;
        height: 45px;
        background: var(--deep-space);
        color: white;
        border: none;
        border-radius: 8px;
        cursor: pointer;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        gap: 5px;
        z-index: 1002;
        box-shadow: 0 4px 10px rgba(0,0,0,0.2);
    }

    .menu-toggle span {
        display: block;
        width: 25px;
        height: 3px;
        background: var(--white);
        border-radius: 2px;
        transition: 0.3s;
    }

    /* Hamburger to X Animation */
    .menu-toggle.open span:nth-child(1) { transform: translateY(8px) rotate(45deg); }
    .menu-toggle.open span:nth-child(2) { opacity: 0; }
    .menu-toggle.open span:nth-child(3) { transform: translateY(-8px) rotate(-45deg); }

    .sidebar-header { 
        padding: 20px; 
        background: rgba(0,0,0,0.15);
        border-bottom: 1px solid rgba(255,255,255,0.1);
    }

    /* Compact Nav Items */
    .nav-item { 
        width: 100%; 
        padding: 12px 20px; 
        border: none; 
        background: none; 
        color: #8E9AAF; 
        text-align: left; 
        cursor: pointer; 
        font-size: 0.75rem; /* Smaller font */
        display: flex;
        align-items: center;
        gap: 12px;
    }

    /* Adjust main content to take full width since sidebar is floating */
    .content { flex: 1; margin-left: 0; }
    .top-bar { padding-left: 85px; } /* Make room for the hamburger */
</style>

<button class="menu-toggle" id="menu-btn">
    <span></span>
    <span></span>
    <span></span>
</button>

<aside class="sidebar" id="main-sidebar">
    <div class="sidebar-header">
        <h2 style="font-size: 0.8rem;">IMI Navigation</h2>
    </div>
    <div class="nav-list" id="sidebar-nav"></div>
</aside>
