<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>IMI Logistics Dashboard</title>
    <script src="https://cdn.sheetjs.com/xlsx-0.20.1/package/dist/xlsx.full.min.js"></script>
    <style>
        :root {
            --mi-red: #D6192B;
            --deep-space: #24223F;
            --white: #FFFEFF;
            --off-white: #F5F7FA;
            --text-gray: #718096;
        }

        body { 
            font-family: 'Inter', -apple-system, sans-serif; 
            background: var(--off-white); 
            margin: 0; 
            display: flex; 
            height: 100vh; 
            overflow: hidden;
        }

        /* Dashboard UI Elements */
        .sidebar { width: 300px; background: var(--deep-space); color: var(--white); display: flex; flex-direction: column; z-index: 10; }
        .sidebar-header { padding: 40px 24px; background: rgba(0,0,0,0.15); border-bottom: 1px solid rgba(255,255,255,0.1); }
        .sidebar-header h2 { font-size: 1.1rem; margin: 0; letter-spacing: 1.2px; font-weight: 900; color: var(--white); text-transform: uppercase; }
        .nav-list { flex: 1; padding: 25px 0; overflow-y: auto; }
        .nav-item { width: 100%; padding: 16px 28px; border: none; background: none; color: #8E9AAF; text-align: left; cursor: pointer; font-size: 0.85rem; display: flex; align-items: center; gap: 15px; text-transform: uppercase; }
        .nav-item.active { background: var(--mi-red); color: var(--white); font-weight: 700; }
        .content { flex: 1; overflow-y: auto; display: flex; flex-direction: column; }
        .top-bar { background: var(--white); padding: 20px 45px; display: flex; justify-content: space-between; align-items: center; }
        .view-area { padding: 45px; }
        .card { background: var(--white); border-radius: 20px; padding: 35px; box-shadow: 0 15px 35px rgba(36, 34, 63, 0.08); }

        /* The Outer Wrapper: Clips the bottom of the widget */
        .hard-clip-wrapper {
            margin: 0 auto;
            position: relative;
            overflow: hidden !important; 
            border-radius: 15px;
            border: 1px solid #eee;
            background: #fff;
            display: block;
        }

        /* RE-ENABLE INTERNAL SCROLLING FOR THE LIST */
        /* We target Elfsight's common list containers specifically */
        [class*="elfsight-app"] [class*="Container"],
        [class*="elfsight-app"] [class*="List"],
        [class*="elfsight-app"] [class*="ScrollContainer"] {
            overflow-y: auto !important;
            scrollbar-width: thin !important; /* Shows a small scrollbar for the list only */
            -ms-overflow-style: auto !important;
        }

        /* Global Dashboard Scrollbar Hider (Doesn't affect Elfsight internal list) */
        .content::-webkit-scrollbar,
        .nav-list::-webkit-scrollbar,
        body::-webkit-scrollbar {
            display: none;
        }
        
        #upload-overlay { position: fixed; inset: 0; background: var(--off-white); z-index: 1000; display: flex; align-items: center; justify-content: center; }
        .drop-box { background: var(--white); padding: 70px; border-radius: 30px; text-align: center; width: 480px; box-shadow: 0 30px 60px rgba(0,0,0,0.1); }
        .btn-upload { background: var(--mi-red); color: var(--white); border: none; padding: 16px 36px; border-radius: 12px; font-weight: 800; cursor: pointer; margin-top: 30px; }
    </style>
</head>
<body>
    <div id="upload-overlay">
        <div class="drop-box">
            <div style="font-size: 50px; margin-bottom: 15px;">🚢</div>
            <h1 style="color: var(--deep-space); margin: 0; font-weight: 900;">IMI Logistics</h1>
            <p style="color: var(--text-gray);">Dashboard & Optimization Tool</p>
            <input type="file" id="file-input" hidden accept=".xlsx, .xls">
            <button class="btn-upload" onclick="document.getElementById('file-input').click()">UPLOAD DATASET</button>
        </div>
    </div>
    <aside class="sidebar">
        <div class="sidebar-header"><h2>IMI Logistics Dashboard</h2></div>
        <div class="nav-list" id="sidebar-nav"></div>
    </aside>
    <main class="content">
        <div class="top-bar">
            <h3 id="current-sheet-title" style="margin:0; font-weight: 800; color: var(--deep-space);">Welcome</h3>
            <div id="file-name-display"></div>
        </div>
        <div class="view-area">
            <div class="card" id="data-card">
                <div id="table-output"></div>
                <div id="map-container"></div>
            </div>
        </div>
    </main>
    <script src="https://elfsightcdn.com/platform.js" async></script>
    <script src="app.js"></script>
</body>
</html>
