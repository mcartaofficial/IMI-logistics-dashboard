<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>IMI Logistics Dashboard</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <style>
        :root {
            --imi-red: #D6192B;
            --navy: #24223F;
            --white: #FFFEFF;
            --bg: #f4f7fa;
        }

        body { 
            font-family: 'Inter', -apple-system, sans-serif; 
            background: var(--bg); 
            margin: 0; 
            display: flex; 
            height: 100vh; 
            overflow: hidden;
        }

        /* Sidebar Branding */
        .sidebar { 
            width: 280px; 
            background: var(--navy); 
            color: var(--white); 
            display: flex; 
            flex-direction: column;
            box-shadow: 4px 0 10px rgba(0,0,0,0.1);
        }

        .sidebar-header { 
            padding: 30px 20px; 
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }

        .sidebar-header h2 { 
            font-size: 1.1rem; 
            margin: 0; 
            font-weight: 800;
            color: var(--white);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .nav-list { flex: 1; padding: 20px 0; overflow-y: auto; }

        .nav-item { 
            width: 100%; padding: 14px 24px; border: none; background: none; 
            color: #a0aec0; text-align: left; cursor: pointer; font-size: 0.9rem;
            transition: 0.2s; display: block;
        }

        .nav-item:hover { background: rgba(255,255,255,0.05); color: white; }
        .nav-item.active { background: var(--imi-red); color: white; font-weight: 600; }

        /* Main Workspace */
        .content { flex: 1; display: flex; flex-direction: column; overflow: hidden; }

        .top-bar { 
            background: var(--white); 
            padding: 15px 40px; 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            border-bottom: 1px solid #e2e8f0;
        }

        .view-area { padding: 30px; flex: 1; overflow-y: auto; }

        .card { 
            background: var(--white); border-radius: 12px; padding: 25px; 
            box-shadow: 0 4px 20px rgba(0,0,0,0.05);
        }

        /* Data Tables */
        table { width: 100%; border-collapse: collapse; }
        th { 
            text-align: left; padding: 12px; background: #f8fafc; 
            color: var(--navy); font-size: 0.75rem; text-transform: uppercase;
            border-bottom: 2px solid #edf2f7;
        }
        td { padding: 12px; border-bottom: 1px solid #edf2f7; font-size: 0.9rem; color: #444; }

        /* Initial Screen */
        #upload-overlay {
            position: fixed; inset: 0; background: var(--bg); z-index: 100;
            display: flex; align-items: center; justify-content: center;
        }
        .drop-box { 
            background: white; padding: 60px; border-radius: 20px; 
            text-align: center; box-shadow: 0 10px 30px rgba(0,0,0,0.1); width: 400px;
        }
        .btn-upload { 
            background: var(--imi-red); color: white; border: none; 
            padding: 14px 35px; border-radius: 8px; font-weight: bold; 
            cursor: pointer; margin-top: 20px; text-transform: uppercase;
        }
    </style>
</head>
<body>

    <div id="upload-overlay">
        <div class="drop-box">
            <h1 style="color: var(--navy); margin-bottom: 5px;">IMI Logistics</h1>
            <p style="color: #666; margin-top: 0;">Optimization Dashboard</p>
            <input type="file" id="file-input" hidden accept=".xlsx, .xls">
            <button class="btn-upload" onclick="document.getElementById('file-input').click()">Upload Dataset</button>
        </div>
    </div>

    <aside class="sidebar">
        <div class="sidebar-header">
            <h2>IMI Logistics Dashboard</h2>
        </div>
        <div id="sidebar-nav" class="nav-list"></div>
    </aside>

    <main class="content">
        <div class="top-bar">
            <h3 id="current-sheet-title" style="margin:0; color: var(--navy)">Route Overview</h3>
            <div id="file-name-display" style="font-size: 0.8rem; font-weight: bold; color: var(--imi-red)"></div>
        </div>
        <div class="view-area">
            <div class="card">
                <div id="table-output"></div>
            </div>
        </div>
    </main>

    <script src="app.js"></script>
</body>
</html>
